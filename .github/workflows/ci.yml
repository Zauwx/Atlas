name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    name: Format, lint, build, test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check formatting
        run: npm run format:check

      - name: Lint
        run: npm run lint

      - name: Build (typecheck all packages)
        run: npm run build

      - name: Test
        run: npm test
