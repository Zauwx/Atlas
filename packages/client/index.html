<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Atlas</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0e1420;
        color: #dce3f0;
        font-family: system-ui, sans-serif;
      }
      #app {
        width: 100%;
        height: 100%;
        display: flex;
        align-items: center;
        justify-content: center;
      }
      #status {
        position: absolute;
        top: 12px;
        left: 50%;
        transform: translateX(-50%);
        font-size: 14px;
        opacity: 0.85;
      }
      /* An explicit display rule beats the hidden attribute, so restore it. */
      #class-select[hidden] {
        display: none;
      }
      #class-select {
        position: absolute;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
      }
      #class-select h1 {
        margin: 0;
        font-size: 22px;
        font-weight: 600;
      }
      #class-select p.hint {
        margin: 0;
        opacity: 0.65;
        font-size: 13px;
      }
      #class-options {
        display: flex;
        flex-wrap: wrap;
        gap: 14px;
        justify-content: center;
      }
      .class-card {
        width: 260px;
        text-align: left;
        padding: 16px;
        border: 1px solid #2a3a55;
        border-radius: 8px;
        background: #141c2c;
        color: inherit;
        font: inherit;
        cursor: pointer;
      }
      .class-card:hover,
      .class-card:focus-visible {
        border-color: #4e8cff;
        outline: none;
      }
      .class-card h2 {
        margin: 0 0 6px;
        font-size: 16px;
      }
      .class-card .stats {
        font-size: 13px;
        opacity: 0.85;
        margin-bottom: 8px;
      }
      .class-card .desc {
        font-size: 12px;
        opacity: 0.7;
        margin-bottom: 10px;
      }
      .class-card ul {
        margin: 0;
        padding-left: 16px;
        font-size: 12px;
        opacity: 0.75;
      }
    </style>
  </head>
  <body>
    <div id="app"></div>
    <div id="class-select" hidden>
      <h1>Choose your class</h1>
      <p class="hint">You keep this for the whole match. Both players may pick the same one.</p>
      <div id="class-options"></div>
    </div>
    <div id="status"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
